// Top-level build file where you can add configuration options common to all
// sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9.4.1 requires Gradle 9.6.0 (see gradle/wrapper) and JDK 17+.
        // It transitively provides the Kotlin Gradle plugin (KGP 2.2.10+),
        // so no separate kotlin-gradle-plugin classpath entry is needed.
        classpath "com.android.tools.build:gradle:9.4.1"
        // Hosts the com.android.legacy-kapt plugin implementation, needed for
        // DataBinding processing under built-in Kotlin.
        classpath "com.android.tools.build:gradle-kotlin:9.4.1"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.10.2"
        // KSP 2.3.12: versions >= 2.3.6 are required for AGP 9's built-in
        // Kotlin (older KSP registers generated sources via the now
        // disallowed kotlin.sourceSets DSL).
        classpath "com.google.devtools.ksp:symbol-processing-gradle-plugin:2.3.12"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    // Applies to the root project only; the ** globs below format the
    // Kotlin sources of every module from here.
    id "com.diffplug.spotless" version "8.9.0"
}

// Version constants shared with modules via $rootProject.<name>
ext {
    // App version
    versionName = '2.0.5' // X.Y.Z; X = Major, Y = minor, Z = Patch level
    versionCodeBase = 20500 // XYZZM; M = Module (tv, mobile)
    versionCodeTv = versionCodeBase + 2 // Not used at the moment
    versionCodeMobile = versionCodeBase + 3 // Leave some space for future-proofing

    // SDK and tools
    compileSdkVersion = 36
    // 24: required by Navigation 2.10 / Room 2.8 (Android 7.0+, 2016)
    minSdkVersion = 24
    targetSdkVersion = 36

    // App dependencies. The 2019-era library versions are intentionally kept
    // so the existing sources keep compiling; only the versions the AGP 9
    // toolchain requires were bumped.
    aiaVersion = '1.1.0'
    archCoreTestingVersion = '2.1.0-rc01'
    appcompatVersion = '1.1.0-rc01'
    browserVersion = '1.0.0-beta01'
    constraintLayoutVersion = '1.1.2'
    coreVersion = '1.2.0-alpha04'
    coroutinesVersion = '1.11.0'
    dagger = "2.60.1"
    espressoVersion = '3.1.0-alpha1'
    // Bumped from 0.3.2: the old com.google.android:flexbox coordinate only
    // existed on Google's internal prebuilts maven. 3.0.0 is public and keeps
    // the same com.google.android.flexbox package (no source changes).
    flexboxVersion = "3.0.0"
    fragmentVersion = '1.1.0-rc04'
    glideVersion = "4.16.0"
    gsonVersion = "2.8.1"
    hamcrestVersion = '1.3'
    junitVersion = '4.12'
    kotlinVersion = '2.2.10'
    ktxVersion = "1.0.0"
    lifecycleVersion = '2.2.0-alpha03'
    materialVersion = '1.1.0-alpha09'
    mockitoVersion = "2.8.9"
    mockitoKotlinVersion = "1.5.0"
    // Bumped from 2.1.0-rc01: the safe-args Gradle plugin must be compatible
    // with Gradle 9.6 and match the navigation runtime.
    navigationVersion = "2.10.2"
    okhttpVersion = "3.10.0"
    okioVersion = '1.14.0'
    roomVersion = '2.8.5'
    rulesVersion = '1.1.1'
    runnerVersion = '1.1.1'
    testExtVersion = '1.1.0'
    threetenabpVersion = "1.0.5"
    threetenbpVersion = "1.3.6"
    timberVersion = "4.7.1"
    workVersion = "2.2.0"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

spotless {
    kotlin {
        target "**/*.kt"
        targetExclude "**/build/**", ".idea/**"
        ktlint()
    }
}
