apply plugin: 'com.android.application'
// AGP 9 built-in Kotlin replaces kotlin-android. kotlin-android-extensions was
// removed from the Kotlin plugin (synthetic view access migrated to
// findViewById in SearchFragment). Room and Dagger run on KSP.
apply plugin: 'com.google.devtools.ksp'
// DataBinding still needs kapt-style processing: under built-in Kotlin the
// DataBinding processor running on javac cannot see Kotlin @BindingAdapters
// (https://issuetracker.google.com/issues/542651953). legacy-kapt runs the
// DataBinding compiler where Kotlin adapters are visible.
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'androidx.navigation.safeargs.kotlin'

android {
    namespace 'com.carthigan.droidconuganda'
    compileSdk rootProject.compileSdkVersion
    defaultConfig {
        applicationId "com.carthigan.droidconuganda"
        minSdk rootProject.minSdkVersion
        targetSdk rootProject.targetSdkVersion
        versionName rootProject.versionName
        versionCode rootProject.versionCodeMobile
        testInstrumentationRunner "com.carthigan.droidconuganda.tests.CustomTestRunner"

        vectorDrawables.useSupportLibrary true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // AGP 9 only supports the optimized default ProGuard file.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
        }
        staging {
            initWith debug

            // Specifies a sorted list of fallback build types that the
            // plugin should try to use when a dependency does not include a
            // "staging" build type.
            // Used with :test-shared, which doesn't have a staging variant.
            matchingFallbacks = ['debug']
        }
    }
    buildFeatures {
        dataBinding true
        // MainApplication reads BuildConfig.DEBUG (off by default since AGP 8)
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        // We need to sign debug builds with a debug key to make firebase auth happy
        debug {
            storeFile file("../debug.keystore")
            keyAlias "androiddebugkey"
            keyPassword "android"
            storePassword "android"
        }
    }

    // debug and release variants share the same source dir
    sourceSets {
        debug.kotlin.srcDir 'src/debugRelease/java'
        release.kotlin.srcDir 'src/debugRelease/java'
    }

    lint {
        disable 'InvalidPackage', 'MissingTranslation'
    }

    testBuildType "staging"
}

dependencies {
    implementation project(':shared')
    testImplementation project(':test-shared')
    testImplementation project(':androidTest-shared')
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // UI
    implementation "androidx.appcompat:appcompat:$rootProject.appcompatVersion"
    implementation "androidx.browser:browser:$rootProject.browserVersion"
    implementation "androidx.constraintlayout:constraintlayout:$rootProject.constraintLayoutVersion"
    implementation "com.google.android.material:material:$rootProject.materialVersion"
    implementation "com.google.android.flexbox:flexbox:$rootProject.flexboxVersion"

    implementation "androidx.core:core-ktx:$rootProject.coreVersion"

    // Architecture Components
    implementation "androidx.lifecycle:lifecycle-extensions:$rootProject.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$rootProject.lifecycleVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$rootProject.lifecycleVersion"
    implementation "androidx.fragment:fragment-ktx:$rootProject.fragmentVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$rootProject.lifecycleVersion"
    implementation "androidx.room:room-ktx:$rootProject.roomVersion"
    implementation "androidx.room:room-runtime:$rootProject.roomVersion"
    ksp "androidx.room:room-compiler:$rootProject.roomVersion"
    implementation "androidx.navigation:navigation-fragment-ktx:$rootProject.navigationVersion"
    implementation "androidx.navigation:navigation-ui-ktx:$rootProject.navigationVersion"
    testImplementation "androidx.arch.core:core-testing:$rootProject.archCoreTestingVersion"

    // Dagger
    implementation "com.google.dagger:dagger-android:$rootProject.dagger"
    implementation "com.google.dagger:dagger-android-support:$rootProject.dagger"
    ksp "com.google.dagger:dagger-compiler:$rootProject.dagger"
    ksp "com.google.dagger:dagger-android-processor:$rootProject.dagger"

    // Glide (no annotation processor: the app has no @GlideModule)
    implementation "com.github.bumptech.glide:glide:$rootProject.glideVersion"

    // Firebase was removed: the app has no account system. Local starred
    // sessions are stored on-device (see LocalUserEventDataSource).

    // Date and time API for Java.
    api "com.jakewharton.threetenabp:threetenabp:$rootProject.threetenabpVersion"
    testImplementation "org.threeten:threetenbp:$rootProject.threetenbpVersion"
    implementation "androidx.core:core-ktx:$rootProject.ktxVersion"

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$rootProject.kotlinVersion"

    // Instrumentation tests
    androidTestImplementation "androidx.test.espresso:espresso-core:$rootProject.espressoVersion"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:$rootProject.espressoVersion"
    androidTestImplementation "androidx.test.ext:junit:$rootProject.testExtVersion"
    androidTestImplementation "androidx.test:runner:$rootProject.runnerVersion"
    androidTestImplementation "androidx.test:rules:$rootProject.rulesVersion"
    stagingImplementation "androidx.fragment:fragment-testing:$rootProject.fragmentVersion"
    kspAndroidTest "com.google.dagger:dagger-compiler:$rootProject.dagger"
    kspAndroidTest "com.google.dagger:dagger-android-processor:$rootProject.dagger"

    // Local unit tests
    testImplementation "junit:junit:$rootProject.junitVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$rootProject.coroutinesVersion"
    testImplementation "org.mockito:mockito-core:$rootProject.mockitoVersion"
    testImplementation "com.nhaarman:mockito-kotlin:$rootProject.mockitoKotlinVersion"
    testImplementation "org.hamcrest:hamcrest-library:$rootProject.hamcrestVersion"

    // Solve conflicts with gson. DataBinding is using an old version.
    implementation "com.google.code.gson:gson:$rootProject.gsonVersion"
}
