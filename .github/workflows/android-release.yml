name: Build and release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for a GitHub Release. Leave empty to only build an artifact.
        required: false
        type: string
      release_name:
        description: Optional release title.
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          SAFE_TAG=$(printf '%s' "$TAG" | tr '/ ' '--')
          cp mobile/build/outputs/apk/debug/mobile-debug.apk \
            "dist/Droidcon-Uganda-${SAFE_TAG}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidcon-uganda-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_name || format('Droidcon Uganda {0}', inputs.release_tag || github.ref_name) }}
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
