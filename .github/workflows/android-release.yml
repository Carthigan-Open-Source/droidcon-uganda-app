name: Build and release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for a GitHub Release. Leave empty to only build an artifact.
        required: false
        type: string
      release_name:
        description: Optional release title.
        required: false
        type: string
      publish_to_play:
        description: Upload a signed AAB to Google Play.
        required: false
        default: false
        type: boolean
      play_track:
        description: Google Play track.
        required: false
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      play_status:
        description: Play release status. Draft is safest.
        required: false
        default: draft
        type: choice
        options:
          - draft
          - inProgress
          - completed
          - halted
      version_code:
        description: Optional version code. Defaults to a monotonic workflow value.
        required: false
        type: string
      play_upload:
        description: Upload the bundle to Play. Turn off to only build the signed AAB.
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :mobile:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          SAFE_TAG=$(printf '%s' "$TAG" | tr '/ ' '--')
          cp mobile/build/outputs/apk/debug/mobile-debug.apk \
            "dist/Droidcon-Uganda-${SAFE_TAG}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droidcon-uganda-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_name || format('Droidcon Uganda {0}', inputs.release_tag || github.ref_name) }}
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

  play:
    name: Publish signed AAB to Google Play
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate Play secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          }
          test -n "$PLAY_SERVICE_ACCOUNT_JSON" || {
            echo "Missing PLAY_SERVICE_ACCOUNT_JSON secret."
            exit 1
          }

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks"

      - name: Resolve version code
        id: version
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ -n "$INPUT_VERSION_CODE" ]; then
            CODE="$INPUT_VERSION_CODE"
          else
            CODE=$((20503 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :mobile:bundleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            --no-daemon --stacktrace
          test -f mobile/build/outputs/bundle/release/mobile-release.aab

      - name: Upload Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ github.run_number }}
          path: |
            mobile/build/outputs/bundle/release/mobile-release.aab
            mobile/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Google Play
        if: inputs.play_upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.carthigan.droidconuganda
          releaseFiles: mobile/build/outputs/bundle/release/mobile-release.aab
          tracks: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
          releaseName: Droidcon Uganda ${{ steps.version.outputs.code }}
          mappingFile: mobile/build/outputs/mapping/release/mapping.txt
